aid: kaiahealth
name: kaiahealth
description: >-
  Kaia Health is a digital therapeutics company founded in 2016 (New York and Munich) that delivers
  evidence-based, digital-first care for musculoskeletal (MSK) pain and respiratory conditions. Its
  smartphone apps use AI and computer vision (motion tracking) plus in-house physical-therapy doctors
  to guide members through clinically validated exercise and behavioral programs without appointments
  or wearable devices. Products include Kaia MSK (joint and muscle care) and Kaia Breathe (respiratory /
  COPD). The company sells to employers and health plans, claims 2,500+ enterprise clients and 3x ROI,
  and is HIPAA, GDPR, HITRUST, SOC 2 Type II, ISO 27001, ISO 13485, and CE-certified. Kaia Health was
  acquired by Sword Health in January 2026. It is backed by Balderton Capital. Kaia Health publishes no
  public API; this profile captures its identity, security, and compliance posture.
